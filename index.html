<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Selección</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(88vw, 620px);
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    p {
      margin: 26px 0 0;
      color: #d4af57;
      font-size: clamp(18px, 2.4vw, 30px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.jpg" alt="Atlas Selección">
    <p>Próximamente</p>
  </main>
</body>
</html>
